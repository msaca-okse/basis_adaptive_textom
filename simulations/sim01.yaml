# config.yaml

# Preprocessing parameters
pad: 300    # padding during cartesian -> polar (determines the max 2theta)
center: [33, 28]
pixel_size: 1.72e-4        # meters per pixel (172 µm) (pilatus detector)
wavelength: 35    # in kev

# Geometry parameters
detector_distance: 0.6     # meters
N_theta: 8
min_two_theta: 0.05
max_two_theta: 0.22
N_chi: 180
N_rot: 90
Nx: 103
Ny: 103
j_direction_0: [-1,0,0]
k_direction_0: [0,1,0]
p_direction_0: [0,0,1]
detector_direction_origin: [-1, 0, 0]
detector_direction_positive_90: [0, -1, 0]
angle_range: [0, 178] # rotation angle including endpoint
cor_offset: 0

N_workers_integration: 10
factor_integration: 3
chunk_size_integration: 8

grid_resolution_parameter: 5
kernel_sigma: 0.3
peak_width: 0.001
reflection_cutoff: 0.2    # Only reflections with intensity >= reflection_cutoff * "maximum peak intensity" are saved

N_iter: 30


cif_path: "/dtu-compute/msaca/sliceA_diffraction/cif-files_and_theoretical_pd_spectra/cif/selected_cifs"
poni_path: "/dtu/3d-imaging-center/projects/2025_QIM_BlackBeauty/raw_data_extern/simulations/textom/azimuthal_integration/Eiger_4M.poni"
reflections_folder: "h5_files2"

datapath: "/dtu/3d-imaging-center/projects/2025_QIM_BlackBeauty/raw_data_extern/simulations/textom/data/scans"
diffraction_file: "s3dxrd.h5"